name: EduManage CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  flutter-ci:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Test Suite
        run: flutter test

  backend-ci:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'edumanage-backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./edumanage-backend
        run: npm ci

      - name: Run Backend Integration & Unit Tests
        working-directory: ./edumanage-backend
        run: npm test
